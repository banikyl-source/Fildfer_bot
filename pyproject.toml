[project]
name = "receipt-pdf-bot"
version = "0.1.0"
description = "Telegram bot that renders demo (sample-watermarked) PDF receipts from user-provided fields."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28.2",
    "aiohttp-socks>=0.11.0",
    "python-dotenv>=1.2.2",
    "reportlab>=4.5.0",
    "pypdf>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_pdf_bot"]

[dependency-groups]
dev = [
    "numpy>=2.4.4",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6",
]
